name: release

# Publishing is deliberately manual: cut a GitHub release, and only then does anything reach PyPI.
# Nothing here fires on push.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is what people install; the version is what pip records. If they disagree, someone
      # forgot to bump one of them, and a wrong version on PyPI cannot be replaced — only yanked.
      - name: Check the tag matches [project].version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              sys.exit(f"tag {tag!r} is not semantic versioning (expected vMAJOR.MINOR.PATCH)")
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"{tag} matches pyproject {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
