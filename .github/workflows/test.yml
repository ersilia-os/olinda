name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # [dev] carries rdkit as an oracle, so this includes the byte-for-byte WebAssembly-vs-RDKit check.
      - name: Test
        run: pytest -q

  # The base install promises numpy, onnxruntime and wasmtime, and nothing more: no rdkit, no pandas,
  # no CLI stack. The job above can never catch a stray extras-only import on that path, because it
  # has everything. This one builds a model with the training stack in one venv, then loads and scores
  # it with ONLY the base install in another.
  inference-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a fixture model with the training stack
        run: |
          python -m venv /tmp/trainenv
          /tmp/trainenv/bin/pip install --upgrade pip
          # pytest too: the fixture builder lives in tests/conftest.py, which imports pytest.
          /tmp/trainenv/bin/pip install ".[train]" pytest
          /tmp/trainenv/bin/python -c "
          from tests.conftest import build_tiny_model
          build_tiny_model('/tmp/fixture')
          "
      - name: Install (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Test the inference path
        env:
          OLINDA_FIXTURE_MODEL: /tmp/fixture/model.onnx
        run: |
          # nothing the base install promised away may be present
          ! python -c "import rdkit"
          ! python -c "import pandas"
          ! python -c "import click"
          pytest -q tests/test_inference_install.py
      # Run the console script itself, from outside the repo so the checkout cannot shadow the
      # installed package. On a base install it must name the extra, not print a traceback.
      - name: The olinda command names the CLI extra
        run: |
          cd /tmp
          ! olinda --help 2>&1 | tee /tmp/cli.log
          grep -q 'olinda\[cli\]' /tmp/cli.log
          ! grep -q "Traceback" /tmp/cli.log

  # `pip install "olinda[cli]"` is how most people run a model: `olinda predict`, still without
  # rdkit or pandas.
  cli-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a fixture model with the training stack
        run: |
          python -m venv /tmp/trainenv
          /tmp/trainenv/bin/pip install --upgrade pip
          /tmp/trainenv/bin/pip install ".[train]" pytest
          /tmp/trainenv/bin/python -c "
          from tests.conftest import build_tiny_model
          build_tiny_model('/tmp/fixture')
          "
      - name: Install (cli extra only)
        run: |
          python -m pip install --upgrade pip
          pip install ".[cli]"
      - name: Predict, and refuse what this tier cannot do
        run: |
          cd /tmp
          ! python -c "import rdkit"
          ! python -c "import pandas"
          olinda --help
          olinda predict -m /tmp/fixture/model.onnx -i /tmp/fixture/soft.csv -o /tmp/pred.csv
          head -3 /tmp/pred.csv
          # a distilling command must name its extra rather than dying on an import
          touch x.csv  # the file must exist, or click rejects it before the extra is checked
          ! olinda fit -s x.csv -m y.onnx 2>&1 | tee /tmp/fit.log
          grep -q "olinda\[train\]" /tmp/fit.log
          ! grep -q "Traceback" /tmp/fit.log

  # `pip install "olinda[report]"` promises you can validate a model you were handed. The `test` job
  # cannot check that: it has the training stack, so every import resolves whether the extra declares
  # it or not. This one builds a model with [train] in one venv, then scores it with ONLY [report] in
  # another — the same reason `inference-install` exists, one tier up.
  report-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a fixture model with the training stack
        run: |
          python -m venv /tmp/trainenv
          /tmp/trainenv/bin/pip install --upgrade pip
          /tmp/trainenv/bin/pip install ".[train]" pytest
          /tmp/trainenv/bin/python -c "
          from tests.conftest import build_tiny_model
          build_tiny_model('/tmp/fixture')
          "
      - name: Install (report extra only)
        run: |
          python -m pip install --upgrade pip
          pip install ".[report]"
      - name: Validate with the reporting extra alone
        run: |
          olinda validate -m /tmp/fixture/model.onnx \
            -s /tmp/fixture/soft.csv -h /tmp/fixture/hard.csv -o /tmp/report
          test -f /tmp/report/report.html
          test -f /tmp/report/metrics.json
          test -f /tmp/report/performance_table.csv
