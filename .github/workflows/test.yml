name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,viz,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  # The base install promises numpy/pandas/rdkit/onnxruntime and nothing more. The job above can
  # never catch a stray training-only import on the inference path, because it has the whole stack.
  inference-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test the inference path
        run: pytest -q tests/test_inference_install.py
