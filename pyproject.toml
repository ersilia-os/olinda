[project]
name = "olinda"
version = "1.0.0"
description = "A model distillation library"
readme = "README.md"
requires-python = ">=3.11"
# Base install is INFERENCE ONLY: everything `olinda.OlindaArtifact` needs to run a distilled
# model.onnx, and nothing else. Training pulls in an order of magnitude more — see [train].
dependencies = [
    "numpy==2.1.3",
    "onnxruntime==1.20.1",
    "pandas==2.3.0",
    "rdkit==2025.9.4",
]

[project.optional-dependencies]
# Everything needed to distil a model and to use the `olinda` CLI.
# NOTE: lazyqsar[fit]==3.4.2 hard-pins numpy, onnxruntime, pandas, h5py, psutil, loguru, onnxmltools
# and xgboost — the versions here match what it forces, so changing one means checking lazyqsar first.
train = [
    "click==8.4.2",
    "h5py==3.14.0",
    "lazyqsar[fit]==3.4.2",
    "lightgbm==4.6.0",
    "loguru==0.7.3",
    "onnx==1.22.0",
    "onnxmltools==1.16.0",
    "optuna==4.9.0",
    "psutil==7.0.0",
    "pyarrow==24.0.0",  # pandas' parquet engine; olinda reads teacher/query files as .parquet
    "rich==14.1.0",
    "rich-click==1.9.8",
    "tqdm==4.68.3",
    "xgboost==3.2.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
]
# Plots go through stylia; matplotlib is pinned rather than left to stylia's floor because it is what
# actually renders the figures, and a drifting version changes them.
viz = [
    "matplotlib==3.11.0",
    "stylia==1.0.1",
]
[project.scripts]
olinda = "olinda._entry:main"

[tool.setuptools.packages.find]
include = ["olinda*"]
exclude = ["files*", "tests*", "docs*"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
