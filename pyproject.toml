[project]
name = "olinda"
version = "1.0.0"
description = "A model distillation library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "h5py>=3.12.0",
    # Ground-truth (hard-label) models + applicability domain, used in descriptor-agnostic mode
    # (feature matrix in, ONNX out — no [descriptors] extra, so no torch/rdkit/FPSim2 from lazyqsar).
    # NOTE: lazyqsar[fit] pins exact versions that cap several deps below — hence the floors here
    # (pandas 2.3.0, onnxruntime 1.20.1, xgboost 3.2.0) are aligned to what lazyqsar[fit]==3.4.2 forces.
    "lazyqsar[fit]==3.4.2",
    "lightgbm==4.6.0",
    "loguru>=0.7.3",
    "numpy>=2.1.0",
    "onnx>=1.17.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.20.1",
    "pandas>=2.3.0",
    "pyarrow>=23.0.1",
    "rdkit==2025.9.4",
    "rich-click>=1.9.7",
    "tqdm>=4.66.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.2",
]
train = [
    "optuna==4.9.0",
]
viz = [
    "matplotlib>=3.10.8",
    "scipy>=1.11.0",
    "stylia>=1.0.1",
]
[project.scripts]
olinda = "olinda.cli:cli"

[tool.setuptools.package-data]
olinda = ["assets/**", "configs/**"]

[tool.setuptools.packages.find]
include = ["olinda*"]
exclude = ["files*", "tests*", "docs*"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
