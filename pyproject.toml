[project]
name = "olinda"
version = "1.0.0"
description = "A model distillation library"
readme = "README.md"
requires-python = ">=3.11"
# Base install is INFERENCE ONLY: everything `olinda.OnnxArtifact` needs to run a distilled
# model.onnx, and nothing else. Training pulls in an order of magnitude more — see [train].
dependencies = [
    "numpy>=2.1.0",
    "onnxruntime>=1.20.1",
    "pandas>=2.3.0",
    "rdkit==2025.9.4",
]

[project.optional-dependencies]
# Everything needed to distil a model and to use the `olinda` CLI.
# NOTE: lazyqsar[fit] pins exact versions that cap several deps here — the floors below
# (pandas 2.3.0, onnxruntime 1.20.1, xgboost 3.2.0) are aligned to what lazyqsar[fit]==3.4.2 forces.
train = [
    "click>=8.1.0",
    "h5py>=3.12.0",
    "lazyqsar[fit]==3.4.2",
    "lightgbm==4.6.0",
    "loguru>=0.7.3",
    "onnx>=1.17.0",
    "onnxmltools>=1.16.0",
    "optuna==4.9.0",
    "psutil>=7.0.0",
    "pyarrow>=23.0.1",
    "rich-click>=1.9.7",
    "tqdm>=4.66.0",
    "xgboost>=3.2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.2",
]
viz = [
    "matplotlib>=3.10.8",
    "scipy>=1.11.0",
    "stylia>=1.0.1",
]
[project.scripts]
olinda = "olinda._entry:main"

[tool.setuptools.package-data]
olinda = ["assets/**", "configs/**"]

[tool.setuptools.packages.find]
include = ["olinda*"]
exclude = ["files*", "tests*", "docs*"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
