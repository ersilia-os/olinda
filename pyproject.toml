[project]
name = "olinda"
version = "1.0.0"
description = "Distil a slow chemistry model into one fast, self-describing ONNX file"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ersilia Open Source Initiative", email = "hello@ersilia.io" }]
keywords = [
    "drug-discovery",
    "machine-learning",
    "model-distillation",
    "cheminformatics",
    "ersilia",
    "open-science",
    "global-health",
    "onnx",
]
# No "License :: ..." classifier: PEP 639 replaced those with the `license` expression above, and
# setuptools refuses a build that declares both.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Base install is INFERENCE ONLY: everything `olinda.OlindaArtifact` needs to run a distilled
# model.onnx, and nothing else. Training pulls in an order of magnitude more — see [train].
dependencies = [
    "numpy==2.1.3",
    "onnxruntime==1.20.1",
    "pandas==2.3.0",
    "rdkit==2025.9.4",
]

[project.urls]
Homepage = "https://ersilia.io"
Repository = "https://github.com/ersilia-os/olinda"
Issues = "https://github.com/ersilia-os/olinda/issues"

[project.optional-dependencies]
# Reading a model and reporting on it: `olinda validate`, and the figures training writes along the
# way. Enough to inspect a model.onnx you were handed, without any of the *learning* stack — no
# xgboost, lightgbm, optuna, lazyqsar or h5py. onnx reads the graph's own calibration curves and
# stylia/matplotlib draw; matplotlib is pinned rather than left to stylia's floor because it is what
# actually renders the figures, and a drifting version changes them.
#
# The rest of this list is load-bearing, not decoration: `olinda validate` is a click command that
# prints through olinda.console (rich), and the paths it takes to reach the reference library and read
# a label file pull in olinda.helpers (loguru), the download progress bar (tqdm) and pandas' parquet
# engine (pyarrow). All small and pure-Python, so the tier stays light — and CI installs exactly this
# list and then runs `olinda validate`, so a missing one is a failing build, not a user's traceback.
report = [
    "click==8.4.2",
    "loguru==0.7.3",
    "matplotlib==3.11.0",
    "onnx==1.22.0",
    "pyarrow==24.0.0",
    "rich==14.1.0",
    "rich-click==1.9.8",
    "stylia==1.0.1",
    "tqdm==4.68.3",
]
# Everything needed to distil a model. Includes [report], since a training run draws its own
# validation figures and the fuse reads the graph back through the same reader.
# NOTE: lazyqsar[fit]==3.4.2 hard-pins numpy, onnxruntime, pandas, h5py, psutil, loguru, onnxmltools
# and xgboost — the versions here match what it forces, so changing one means checking lazyqsar first.
train = [
    "olinda[report]",
    "h5py==3.14.0",
    "lazyqsar[fit]==3.4.2",
    "lightgbm==4.6.0",
    "onnxmltools==1.16.0",
    "optuna==4.9.0",
    "psutil==7.0.0",
    "xgboost==3.2.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
]
[project.scripts]
olinda = "olinda._entry:main"

[tool.setuptools.packages.find]
include = ["olinda*"]
exclude = ["files*", "tests*", "docs*"]
# olinda is a regular package, not a namespace one. Left at the default (true), setuptools also
# registers it as a namespace, and in an editable install the namespace finder can win — which makes
# `olinda/__init__.py` never execute, so `from olinda import OlindaArtifact` fails from any directory
# outside the repo root while `import olinda.data` still works.
namespaces = false

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
