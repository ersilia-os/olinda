[project]
name = "olinda"
version = "2.0.0"
description = "Distil a slow chemistry model into one fast, self-describing ONNX file"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ersilia Open Source Initiative", email = "hello@ersilia.io" }]
keywords = [
    "drug-discovery",
    "machine-learning",
    "model-distillation",
    "cheminformatics",
    "ersilia",
    "open-science",
    "global-health",
    "onnx",
]
# No "License :: ..." classifier: PEP 639 replaced those with the `license` expression above, and
# setuptools refuses a build that declares both.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Base install RUNS MODELS from Python, and nothing else: `olinda.OlindaArtifact` loads a model.onnx,
# featurizes SMILES and scores them. numpy and onnxruntime run the graph; wasmtime runs RDKit's own
# parser and Morgan generator compiled to WebAssembly (olinda/featurizer/rdkit_qmfp.wasm, built from
# wasm/), so there is no rdkit package to install or to match, and the wheel stays pure Python.
#
# Everything else is an extra. `pip install olinda` still installs an `olinda` script, since entry
# points cannot be optional, and on a base install it answers with the extra to install
# (olinda/_entry.py) rather than a traceback. tests/test_inference_install.py checks that running a
# model imports none of the extras' packages.
dependencies = [
    "numpy==2.1.3",
    "onnxruntime==1.20.1",
    "wasmtime==49.0.0",
]

[project.urls]
Homepage = "https://ersilia.io"
Repository = "https://github.com/ersilia-os/olinda"
Issues = "https://github.com/ersilia-os/olinda/issues"

[project.optional-dependencies]
# The `olinda` command: click and rich-click for the interface, rich for the console, loguru for the
# levelled logger, tqdm for the download bar in `olinda setup`. `olinda predict` needs nothing more:
# it reads CSV/TSV with the standard library.
cli = [
    "click==8.4.2",
    "loguru==0.7.3",
    "rich==14.1.0",
    "rich-click==1.9.8",
    "tqdm==4.68.3",
]
# Scoring a model and reporting on it: `olinda validate`, and the figures training writes along the
# way. Enough to inspect a model.onnx you were handed, without any of the *learning* stack — no
# xgboost, lightgbm, optuna, lazyqsar or h5py. onnx reads the graph's own calibration curves and
# stylia/matplotlib draw; matplotlib is pinned rather than left to stylia's floor because it is what
# actually renders the figures, and a drifting version changes them. pandas holds the label tables,
# and pyarrow is its parquet engine (and lets `olinda predict` read parquet).
#
# CI installs exactly this list and then runs `olinda validate`, so a missing one is a failing build,
# not a user's traceback.
report = [
    "olinda[cli]==2.0.0",  # keep in lockstep with [project].version above
    "matplotlib==3.11.0",
    "onnx==1.22.0",
    "pandas==2.3.0",
    "pyarrow==24.0.0",
    "stylia==1.0.1",
]
# Everything needed to distil a model. Includes [report], since a training run draws its own
# validation figures and the fuse reads the graph back through the same reader. No rdkit: training
# featurizes through the same WebAssembly module as inference, so the two cannot disagree.
# NOTE: lazyqsar[fit]==3.4.2 hard-pins numpy, onnxruntime, pandas, h5py, psutil, loguru, onnxmltools
# and xgboost — the versions here match what it forces, so changing one means checking lazyqsar first.
train = [
    "olinda[report]==2.0.0",  # keep in lockstep with [project].version above
    "h5py==3.14.0",
    "lazyqsar[fit]==3.4.2",
    "lightgbm==4.6.0",
    "onnxmltools==1.16.0",
    "optuna==4.9.0",
    "psutil==7.0.0",
    "xgboost==3.2.0",
]
# rdkit is a test oracle only: tests/rdkit_oracle.py checks the WebAssembly featurizer against it,
# byte for byte. It must be the RDKit release wasm/build.sh compiles (RDKIT_TAG there).
dev = [
    "pytest==9.1.1",
    "rdkit==2026.9.1",
    "ruff==0.15.20",
]

[project.scripts]
olinda = "olinda._entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["olinda*"]
exclude = ["files*", "tests*", "docs*"]
# olinda is a regular package, not a namespace one. Left at the default (true), setuptools also
# registers it as a namespace, and in an editable install the namespace finder can win — which makes
# `olinda/__init__.py` never execute, so `from olinda import OlindaArtifact` fails from any directory
# outside the repo root while `import olinda.data` still works.
namespaces = false

[tool.setuptools.package-data]
# The WebAssembly featurizer, built from wasm/ by wasm/build.sh (in CI for releases) and never committed.
olinda = ["featurizer/*.wasm"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
